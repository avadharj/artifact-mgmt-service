plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.anthropic.artifactmgmt'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

def awsSdkVersion = '2.25.26'
def jacksonVersion = '2.17.0'
def junitVersion = '5.10.2'

dependencies {
    implementation "com.amazonaws:aws-lambda-java-core:1.2.3"
    implementation "com.amazonaws:aws-lambda-java-events:3.11.4"
    implementation "software.amazon.awssdk:dynamodb-enhanced:${awsSdkVersion}"
    implementation "software.amazon.awssdk:s3:${awsSdkVersion}"
    implementation "software.amazon.awssdk:url-connection-client:${awsSdkVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.assertj:assertj-core:3.25.3"
    testImplementation "org.testcontainers:testcontainers:1.19.7"
    testImplementation "org.testcontainers:junit-jupiter:1.19.7"
    testImplementation "org.slf4j:slf4j-simple:2.0.12"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'handlers'
    archiveVersion = ''
    archiveClassifier = ''
    mergeServiceFiles()
}

tasks.register('lambdaPackage', Zip) {
    dependsOn shadowJar
    archiveFileName = 'handlers.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from shadowJar
}

build {
    dependsOn 'lambdaPackage'
}

spotless {
    java {
        googleJavaFormat('1.21.0')
        removeUnusedImports()
    }
}
