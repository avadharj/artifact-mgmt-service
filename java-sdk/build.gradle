plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.anthropic.artifactmgmt'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

def jacksonVersion = '2.17.0'

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    compileOnly "jakarta.annotation:jakarta.annotation-api:3.0.0"
}

sourceSets {
    main {
        java {
            // module-info.java lives here (checked in)
            // generated sources are added by the Makefile before build
            srcDirs = ['src/main/java', '../build/java-sdk-generated/src/main/java']
        }
    }
}

jar {
    archiveBaseName = 'artifact-mgmt-client'
    archiveVersion = project.version
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.anthropic.artifactmgmt'
            artifactId = 'artifact-mgmt-client'
        }
    }
    repositories {
        // CODEARTIFACT_REPO_URL is set by `aws codeartifact login --tool mvn`
        // via the MAVEN_OPTS / settings.xml that login injects.
        // Fallback to mavenLocal() for local development.
        if (System.getenv('CODEARTIFACT_AUTH_TOKEN')) {
            maven {
                url System.getenv('CODEARTIFACT_REPO_URL') ?: ''
                credentials {
                    username 'aws'
                    password System.getenv('CODEARTIFACT_AUTH_TOKEN') ?: ''
                }
            }
        } else {
            mavenLocal()
        }
    }
}

spotless {
    java {
        googleJavaFormat('1.21.0')
        removeUnusedImports()
        // generated files — only lint what we check in
        targetExclude 'src/main/java/**'
    }
}
